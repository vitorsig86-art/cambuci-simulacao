efeitos:
  perda_vento_sem_protecao:
    c: 0.15
    p: 0.1
    o: 0.05
    fonte: 'HIPÓTESE Cambuci, valor herdado da Jurema, sem calibração local. Referência
      histórica não revalidada: premissa a validar: perda de produção do café fora
      da faixa protegida. Base qualitativa: vento causa lesão nas folhas e favorece
      mancha aureolada (Embrapa); renques de grevílea são recomendação antiga do IBC
      para cafezais (Embrapa Florestas). Sem número medido para este lugar'
    confianca: baixa
  perda_faixa_competicao:
    c: 0.4
    p: 0.3
    o: 0.2
